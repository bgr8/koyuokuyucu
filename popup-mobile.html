<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Dark Mode - Mobile Test</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c2c2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            flex-direction: column;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #48484a;
            background: #1c1c1e;
            color: #fff;
            margin-left: 10px;
        }

        .device {
            width: 375px;
            height: 812px;
            border: 12px solid #000;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            background: #fff;
            transition: all 0.3s ease;
        }

        /* Notch simulation for visual realism */
        .device::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .device iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #8e8e93;
        }
    </style>
</head>

<body>
    <div class="header">
        <label for="deviceSelect">Select Device Size:</label>
        <select id="deviceSelect" onchange="changeDevice()">
            <option value="375x812">iPhone X/11/13 Mini (375x812)</option>
            <option value="390x844">iPhone 12/13/14 (390x844)</option>
            <option value="393x852">iPhone 14/15 Pro (393x852)</option>
            <option value="428x926">iPhone Plus/Max (428x926)</option>
            <option value="320x568">iPhone SE (320x568)</option>
            <option value="360x800">Android Medium (360x800)</option>
            <option value="412x915">Android Large (412x915)</option>
            <option value="600x600">Extension Max Width (600x600)</option>
        </select>
    </div>

    <div class="device" id="deviceFrame">
        <!-- We use an iframe to load the actual popup in a restricted responsive context -->
        <iframe src="popupyeni.html"></iframe>
    </div>

    <div class="info">
        <p>Testing popup.html responsive layout and touch targets.</p>
    </div>

    <script>
        function changeDevice() {
            const select = document.getElementById('deviceSelect');
            const device = document.getElementById('deviceFrame');
            const dims = select.value.split('x');
            device.style.width = dims[0] + 'px';
            device.style.height = dims[1] + 'px';

            // Adjust notch visibility based on device width (hide for extension max width)
            if (dims[0] === '600') {
                device.style.borderWidth = '4px';
                device.style.borderRadius = '8px';
            } else {
                device.style.borderWidth = '12px';
                device.style.borderRadius = '40px';
            }
        }
    </script>
</body>

</html>
